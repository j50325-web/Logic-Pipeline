<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>水管排列練習</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--panel:#fff;--ink:#16203a;--mut:#5a6683;--line:#d3dbea;--acc:#2f5fd0;--fix:#1b3a8a;--fixt:#fff;--chb:#cfe6fb;--cht:#16203a;--tile:#e3e7ef;--ok:#1f7a45;--okbg:#e0f2e7;--bad:#b3261e;--badbg:#f9e3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--panel:#182038;--ink:#e6ebf7;--mut:#9aa6c3;--line:#2b3656;--acc:#7aa2ff;--fix:#2c4fae;--chb:#27406e;--cht:#e6ebf7;--tile:#222c48;--ok:#6fd39a;--okbg:#15301f;--bad:#ff8f86;--badbg:#3a1b19}}
:root[data-theme="dark"]{--bg:#0f1626;--panel:#182038;--ink:#e6ebf7;--mut:#9aa6c3;--line:#2b3656;--acc:#7aa2ff;--fix:#2c4fae;--chb:#27406e;--cht:#e6ebf7;--tile:#222c48;--ok:#6fd39a;--okbg:#15301f;--bad:#ff8f86;--badbg:#3a1b19}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 18px 56px;text-align:center}
h1{font-size:26px;line-height:1.3;margin:0 0 8px}
.lead,.meta,small{color:var(--mut)}
.lead{text-align:left}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;justify-content:space-between;align-items:center;text-align:left}
.bar span{color:var(--acc);font-weight:700}
.prog{height:4px;background:var(--line);border-radius:2px;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:2px}
.meta{font-size:14px;margin:0 0 8px;text-align:left}
.q{text-align:left;margin:4px 0 14px}
.lab{font-size:14px;color:var(--mut);margin:6px 0 4px}
.sh{display:flex;justify-content:center;gap:8px}
.tile{width:48px;height:48px;background:var(--tile);border-radius:10px;display:grid;place-items:center}
.tile svg{width:32px;height:32px}
.pipe{width:6px;height:14px;background:var(--chb);margin:0 auto}
.lay{display:flex;justify-content:center;gap:10px}
.box{border:2px solid transparent;border-radius:10px;padding:8px 10px;font-size:20px;font-weight:700;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.fx{background:var(--fix);color:var(--fixt)}
.ch{background:var(--chb);color:var(--cht)}
.ch.on{border-color:#fff;box-shadow:0 0 0 3px var(--acc)}
.lay.act{outline:2px dashed var(--line);outline-offset:6px;border-radius:12px}
.ch.good{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.ch.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.ch:disabled{cursor:default}
.nav{display:flex;justify-content:space-between;margin-top:20px}
.go,.ghost{border-radius:10px;padding:10px 22px;border:1px solid var(--acc);margin-top:6px}
.go{background:var(--acc);color:var(--bg);font-weight:700}
.go:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--acc)}
.fb{margin-top:16px;text-align:left;background:var(--panel);border-left:5px solid var(--line);border-radius:6px;padding:10px 14px}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.fb.ok>b{color:var(--ok)}.fb.no>b{color:var(--bad)}
.step{display:flex;gap:10px;align-items:center;margin:10px 0}
.step .sn{background:var(--fix);color:var(--fixt);border-radius:8px;padding:6px 8px;font-weight:700;letter-spacing:.1em}
.step small{display:block;font-size:13px}
.step .sh{justify-content:flex-start}
.step .tile{width:34px;height:34px;border-radius:8px}.step .tile svg{width:22px;height:22px}
.ex{background:var(--panel);border-radius:10px;padding:12px;margin:14px 0}
ol{text-align:left;padding-left:20px}
.sum{text-align:left;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.row:hover{border-color:var(--acc)}.row>small{flex-shrink:0}
.back{padding:4px 14px;margin:0;font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.op{padding:8px;display:flex;justify-content:center}
.op .tile{width:34px;height:34px}.op .tile svg{width:22px;height:22px}.op .sh{gap:4px}
h2{font-size:18px;text-align:left;margin:26px 0 6px}
.lv{font-size:22px}
.pop{position:fixed;inset:0;background:rgba(10,16,32,.55);display:grid;place-items:center;z-index:10;padding:18px;box-sizing:border-box;animation:fade .25s both}
.card{background:var(--panel);border-radius:18px;padding:26px 32px;text-align:center;max-width:320px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.card .big{font-size:56px;line-height:1.1}
.card h2{text-align:center;margin:8px 0 4px;font-size:22px}
.card p{margin:0 0 14px;color:var(--mut)}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.pop,.card,.confetti i{animation:none}.confetti{display:none}}
.hud{display:flex;justify-content:center;gap:10px;margin:10px 0 6px}
.hud div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 12px;min-width:76px}
.hud small{display:block;font-size:12px;line-height:1.4}
.hud b{font-size:20px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main id="app"></main>
<script>
const v=d=>`<svg viewBox="0 0 40 40">${d}</svg>`;
const S={T:v('<polygon points="20,7 34,32 6,32" fill="#d4a500"/>'),C:v('<circle cx="20" cy="20" r="12" fill="#1e8a3c"/>'),P:v('<path d="M16 6h8v10h10v8H24v10h-8V24H6v-8h10z" fill="#2f74e6"/>'),Q:v('<rect x="8" y="8" width="24" height="24" fill="#e0201b"/>')};
const NAME={T:"三角形",C:"圓形",P:"十字",Q:"方形"},K=["T","C","P","Q"];
const LV={1:"C",2:"FC",3:"CF",4:"FFC",5:"FCF",6:"CFF",7:"CC"};
const TYN={pick:"選水管",fwd:"正推，求輸出",bwd:"反推，求輸入"};
const RT=["pick","fwd","bwd"];
const MODES={
  one:{name:"單階層",desc:"只有一組水管，三選一",spec:()=>({lv:1,ty:"pick"})},
  two:{name:"雙階層",desc:"兩組水管：先練一組固定加一組要選，再練兩組都要選",spec:i=>({lv:i<2?2:i<5?3:7,ty:"pick"})},
  mix:{name:"混合",desc:"1 到 3 組水管，包含選水管、正推和反推，難度慢慢上升",spec:i=>{const L=[[1,"pick"],[1,"fwd"],[2,"bwd"],[2,"pick"],[3,"fwd"],[4,"bwd"],[4,"pick"],[5,"fwd"],[6,"bwd"],[7,"pick"]];if(i<L.length)return{lv:L[i][0],ty:L[i][1]};return{lv:pick([3,4,5,6,7]),ty:pick(RT)}}}
};
const perms=[];(function g(a,r){if(!a.length){perms.push(r);return}a.forEach((x,i)=>g(a.filter((_,j)=>j!=i),[...r,x]))})([1,2,3,4],[]);
const nonId=perms.filter(p=>p.join("")!="1234");
const ap=(r,p)=>p.map(d=>r[d-1]);
const inv=p=>{const q=[];p.forEach((d,k)=>q[d-1]=k+1);return q};
const un=(x,a)=>a.reduce((r,p)=>ap(r,inv(p)),x);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const runWith=(c,ch)=>c.layers.reduce((r,l,k)=>ap(r,l.opts[ch[k]]),c.inp);
function gen(lv,ty){
  for(;;){
    const inp=shuf(K);
    const layers=[...LV[lv]].map(t=>t=="C"&&ty=="pick"?{t,opts:shuf(nonId).slice(0,3),a:Math.floor(Math.random()*3)}:{t:"F",opts:[pick(nonId)],a:0});
    const c={lv,ty,inp,layers},ps=layers.map(l=>l.opts[l.a]),out=runWith(c,layers.map(l=>l.a));
    if(out.join()==inp.join())continue;
    c.out=out;
    if(ty=="pick"){
      let n=0;const rec=(i,ch)=>{if(i==layers.length){if(runWith(c,ch).join()==out.join())n++;return}for(let j=0;j<layers[i].opts.length;j++)rec(i+1,[...ch,j])};
      rec(0,[]);if(n==1)return c;continue;
    }
    const rv=[...ps].reverse();
    const ans=ty=="fwd"?out:un(out,rv);
    const cand=ty=="fwd"?[rv.reduce(ap,inp),un(inp,ps),un(inp,rv)]:[ps.reduce(ap,out),rv.reduce(ap,out),un(out,ps)];
    const seen=new Set([ans.join()]),d=[];
    [...cand,...shuf(perms).map(p=>p.map(x=>K[x-1]))].forEach(x=>{if(d.length<3&&!seen.has(x.join())){seen.add(x.join());d.push(x)}});
    c.opts=shuf([ans,...d]);c.a=c.opts.findIndex(o=>o.join()==ans.join());
    return c;
  }
}
const $=s=>document.querySelector(s);
const row=a=>'<div class="sh">'+a.map(k=>`<span class="tile" role="img" aria-label="${NAME[k]}">${S[k]}</span>`).join("")+"</div>";
const blank='<div class="sh">'+'<span class="tile">？</span>'.repeat(4)+"</div>";
const desk=matchMedia("(hover:hover) and (pointer:fine)").matches;
let mode,i,score=0,streak=0,best=0,gain=0,lost=0,newBest=false,cur,sel,done,first,view,act=0,tStart,elapsed=0;
const isOk=()=>cur.ty=="pick"?sel.every((s,k)=>s==cur.layers[k].a):sel[0]==cur.a;
function home(){view="home";
  const ex=["T","P","Q","C"];
  $("#app").innerHTML=`<h1>水管排列練習</h1><p class="lead">選一種練習。不限關數、沒有計時，想玩多久就玩多久。</p>`+
  Object.entries(MODES).map(([k,m])=>`<button class="row" data-m="${k}"><span><b>${m.name}</b><br><small>${m.desc}</small></span><small>最高連勝 ${bestOf(k)}</small></button>`).join("")+
  `<h2>玩法說明</h2><ol><li>每條水管有 4 個數字。第 k 個數字表示：輸出的第 k 格，放「原本第幾格」的圖形。</li><li>深色水管是固定的，一定會經過；淺色水管有三條，要自己選一條。</li><li>水管由上往下依序套用，最後要剛好排成目標順序。</li><li>正推：給輸入和水管，求輸出。反推：給水管和輸出，求原本的輸入。</li></ol>
  <div class="ex"><div class="lab">例子：水管 2134</div>${row(ex)}<div class="pipe"></div><div class="box fx" style="display:inline-block">2134</div><div class="pipe"></div>${row(ap(ex,[2,1,3,4]))}<small>第 1 格取原本第 2 格（十字），第 2 格取原本第 1 格（三角形），第 3、4 格不變。</small></div>
  <p class="lead">解題小技巧：只看一個格子就能淘汰選項，例如先看目標的第 1 格原本在哪，就能刷掉一半的選擇。</p>`;
  document.querySelectorAll(".row").forEach(b=>b.onclick=()=>begin(b.dataset.m));
}
function initSel(){sel=cur.ty=="pick"?cur.layers.map(l=>l.t=="F"?0:desk?1:null):[desk?0:null];act=cur.layers.findIndex(l=>l.t=="C")}
const fmtT=t=>t<60?t.toFixed(1)+" 秒":Math.floor(t/60)+" 分 "+String(Math.floor(t%60)).padStart(2,"0")+" 秒";
const bkey=m=>"pipeBest_"+m;
const bestOf=m=>{try{return +localStorage.getItem(bkey(m))||0}catch(e){return 0}};
function begin(m){mode=m;i=0;score=0;streak=0;lost=0;best=bestOf(m);next()}
function next(){const q=MODES[mode].spec(i);cur=gen(q.lv,q.ty);initSel();done=false;first=true;tStart=Date.now();draw()}
function draw(){
  const L=cur.layers,ty=cur.ty;view="play";const multi=desk&&ty=="pick"&&L.filter(l=>l.t=="C").length>1;
  const Q={pick:"每組淺色水管選一條，讓輸入的圖形排成目標順序。",fwd:"圖形依序通過這些水管，最後會變成哪一個順序？",bwd:"圖形通過這些水管後變成下方的順序，最初的輸入是哪一個？"};
  let h=`<div class="bar"><button class="ghost back" id="bk">回主畫面</button><span class="lv">Level ${i+1}</span></div><div class="hud"><div><small>分數</small><b>${score}</b></div><div><small>連勝</small><b>${streak>=3?"🔥":""}${streak}</b></div><div><small>最高連勝</small><b>${best}</b></div></div><p class="meta">${TYN[ty]}</p><p class="q">${Q[ty]}</p><div class="lab">輸入</div>${ty=="bwd"?blank:row(cur.inp)}`;
  L.forEach((l,k)=>{h+='<div class="pipe"></div><div class="lay'+(multi&&!done&&k==act?" act":"")+'">'+(l.t=="F"?`<div class="box fx">${l.opts[0].join("")}</div>`:l.opts.map((o,j)=>{let c="box ch";if(done){if(j==l.a)c+=" good";else if(sel[k]==j)c+=" bad"}else if(sel[k]==j)c+=" on";return `<button class="${c}" data-k="${k}" data-j="${j}" ${done?"disabled":""}>${o.join("")}</button>`}).join(""))+"</div>"});
  h+=`<div class="pipe"></div><div class="lab">${ty=="pick"?"目標輸出":"輸出"}</div>${ty=="fwd"?blank:row(cur.out)}`;
  if(ty!="pick")h+='<div class="opts">'+cur.opts.map((o,j)=>{let c="box ch op";if(done){if(j==cur.a)c+=" good";else if(sel[0]==j)c+=" bad"}else if(sel[0]==j)c+=" on";return `<button class="${c}" data-k="0" data-j="${j}" ${done?"disabled":""}>${row(o)}</button>`}).join("")+"</div>";
  if(!done){h+=`<div class="nav"><span></span><button class="go" id="ck" ${sel.includes(null)?"disabled":""}>確認答案</button></div>${desk?`<p class="meta" style="text-align:center">← → 選擇，Enter 送出${ty!="pick"||multi?"，↑ ↓ 上下移動":""}</p>`:""}`}
  else if(!isOk()){
    let r=cur.inp,st=`<div class="lab" style="text-align:left">正確解法</div>${row(r)}`;
    L.forEach(l=>{const p=l.opts[l.a];r=ap(r,p);st+=`<div class="step"><div class="sn">${p.join("")}</div><div>${row(r)}<small>${p.map((d,x)=>`第${x+1}格取原第${d}格`).join("，")}</small></div></div>`});
    h+=`<div class="fb no"><b>差一點！</b>${lost>0?` 連勝 ${lost} 中斷了`:""}${ty!="pick"?"":`<div class="lab" style="text-align:left">你的選擇會得到</div>${row(runWith(cur,sel))}`}${st}</div><div class="nav"><button class="ghost" id="rt">再玩一次</button><button class="go" id="nx">下一關</button></div>`;
  }
  $("#app").innerHTML=h;
  $("#bk").onclick=home;
  document.querySelectorAll(".ch:not(:disabled)").forEach(b=>b.onclick=()=>{act=+b.dataset.k;sel[act]=+b.dataset.j;draw()});
  const ck=$("#ck");if(ck)ck.onclick=()=>{const ok=isOk();newBest=false;if(first){first=false;lost=0;if(ok){streak++;gain=100+10*Math.min(streak-1,10);if(streak>best){best=streak;newBest=true;try{localStorage.setItem(bkey(mode),best)}catch(e){}}}else{lost=streak;streak=0;gain=0}}else gain=ok?30:0;score+=gain;if(ok)elapsed=(Date.now()-tStart)/1000;done=true;draw()};
  const nx=$("#nx");if(nx)nx.onclick=go;
  const rt=$("#rt");if(rt)rt.onclick=()=>{initSel();done=false;draw()};
  if(done&&isOk())pop();else if(done){const r=$("#rt");if(r)r.focus()}
}
function go(){i++;next()}
function pop(){
  const d=document.createElement("div");d.className="pop";
  const cols=["#e0201b","#d4a500","#1e8a3c","#2f74e6","#9b4dff"];
  let c="";for(let k=0;k<28;k++)c+=`<i style="left:${Math.random()*100}%;background:${cols[k%5]};animation-delay:${Math.random()*.5}s;animation-duration:${1.6+Math.random()*1.2}s"></i>`;
  d.innerHTML=`<div class="confetti">${c}</div><div class="card"><div class="big">🎉</div><h2>答對了！恭喜通關</h2><p>Level ${i+1} 完成，+${gain} 分<br>⏱ 用時 ${fmtT(elapsed)}${streak>=2?`<br>🔥 ${streak} 連勝`:""}${newBest?`<br>🏆 新的最高連勝！`:""}</p><button class="go" id="pn">下一關</button><p style="margin:10px 0 0"><small>輕觸螢幕或按 Enter 繼續</small></p></div>`;
  document.body.appendChild(d);
  const t0=Date.now();d.onclick=()=>{if(Date.now()-t0<350||!d.isConnected)return;d.remove();go()};
}
document.addEventListener("keydown",e=>{
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const p=$(".pop");
  if(p){if(e.key=="Enter"){e.preventDefault();p.click()}return}
  if(view!="play")return;
  const k=e.key;
  if(done){if(k=="ArrowLeft"){const r=$("#rt");if(r)r.focus()}else if(k=="ArrowRight"){const r=$("#nx");if(r)r.focus()}return}
  if(k=="Enter"){e.preventDefault();const c=$("#ck");if(c&&!c.disabled)c.click();return}
  const dx=k=="ArrowRight"?1:k=="ArrowLeft"?-1:0,dy=k=="ArrowDown"?1:k=="ArrowUp"?-1:0;
  if(!dx&&!dy)return;
  e.preventDefault();
  if(cur.ty=="pick"){
    const cl=cur.layers.map((l,j)=>l.t=="C"?j:-1).filter(j=>j>=0);
    if(dy){act=cl[(cl.indexOf(act)+dy+cl.length)%cl.length]}
    else{const n=cur.layers[act].opts.length;sel[act]=sel[act]==null?(dx>0?0:n-1):Math.max(0,Math.min(n-1,sel[act]+dx))}
  }else{
    const n=cur.opts.length,j=sel[0]==null?0:sel[0]+dx+2*dy;
    if(j>=0&&j<n)sel[0]=j;
  }
  draw();
});
home();
</script>
</body>
</html>
